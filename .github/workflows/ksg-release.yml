name: KSG Release

# Fables fork (see AGENTS.md): publishes a Fables release of ksg/dev for
# macOS arm64, Linux x64 and Windows x64. Each platform build reuses upstream's
# release-desktop.yml, so build changes arrive with each upstream sync.

on:
  push:
    branches: [ksg/dev]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      mac_runner:
        description: Runner label for the macOS build, such as a one-shot self-hosted runner.
        default: ksg-local
      mac_launch_check:
        description: Launch the built app. Turn off on a machine already running Fables, which shares its Electron profile.
        type: boolean
        default: true

concurrency:
  group: ksg-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      upstream_tag: ${{ steps.version.outputs.upstream_tag }}
      ref: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github/fables-release-series
            .github/scripts/ksg-release-version.cjs
            package.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json

      # Keep upstream tags separate from the fork's release history.
      - name: Fetch upstream nightly tags
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git 'refs/tags/v*:refs/tags/upstream/v*'

      - id: version
        name: Resolve fork version
        run: |
          set -euo pipefail
          upstream="$(git describe --tags --abbrev=0 --match 'upstream/v*-nightly.*' HEAD)"
          upstream="${upstream#upstream/}"
          if [[ ! "$upstream" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-nightly\.[0-9]{8}\.[0-9]+$ ]]; then
            echo "Unexpected upstream tag: $upstream" >&2
            exit 1
          fi
          version="$(node .github/scripts/ksg-release-version.cjs)"
          echo "Upstream $upstream -> Fables $version"
          {
            echo "version=$version"
            echo "tag=v$version"
            echo "upstream_tag=$upstream"
          } >> "$GITHUB_OUTPUT"

  build_bundle:
    name: Build JS bundle
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VITE_KSG_UPSTREAM_TAG: ${{ needs.preflight.outputs.upstream_tag }}
      T3CODE_CLERK_PUBLISHABLE_KEY: ${{ vars.KSG_CLERK_PUBLISHABLE_KEY }}
      T3CODE_CLERK_JWT_TEMPLATE: ${{ vars.KSG_CLERK_JWT_TEMPLATE }}
      T3CODE_CLERK_CLI_OAUTH_CLIENT_ID: ${{ vars.KSG_CLERK_CLI_OAUTH_CLIENT_ID }}
      T3CODE_RELAY_URL: ${{ vars.KSG_RELAY_URL }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - run: vp install --filter=t3... --filter=@t3tools/web... --filter=@t3tools/desktop... --filter=@t3tools/scripts...
      - run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"
      - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config
      - run: vp run build:desktop

      # Upload only the expected hidden file, without opting all build outputs into hidden uploads.
      - name: Stage web asset manifest
        shell: bash
        run: |
          manifest=apps/server/dist/client/.vite/manifest.json
          if [[ -f "$manifest" ]]; then
            cp "$manifest" apps/server/dist/client/vite-manifest.release.json
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  desktop_mac_arm64:
    name: Desktop macOS arm64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: macOS arm64
      runner: ${{ inputs.mac_runner || 'ksg-local' }}
      platform: mac
      target: dmg
      arch: arm64
      rust_target: aarch64-apple-darwin
      resource_key: darwin-arm64
      cli_archive: true
      launch_check: ${{ github.event_name == 'workflow_dispatch' && inputs.mac_launch_check || github.event_name != 'workflow_dispatch' && (inputs.mac_runner || 'ksg-local') != 'ksg-local' }}
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.KSG_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.KSG_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.KSG_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.KSG_RELAY_URL }}

  desktop_linux_x64:
    name: Desktop Linux x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: Linux x64
      runner: ubuntu-24.04
      platform: linux
      target: AppImage
      arch: x64
      rust_target: x86_64-unknown-linux-gnu
      resource_key: linux-x64
      cli_archive: true
      launch_check: true
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.KSG_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.KSG_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.KSG_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.KSG_RELAY_URL }}

  # Starts alongside the Linux job: the Windows desktop embeds the Linux CLI
  # archive for its WSL backend and waits for that artifact inside the job.
  desktop_win_x64:
    name: Desktop Windows x64
    needs: [preflight, build_bundle]
    uses: ./.github/workflows/release-desktop.yml
    secrets: inherit
    with:
      label: Windows x64
      runner: ubuntu-24.04
      verify_runner: windows-2025
      platform: win
      target: nsis
      arch: x64
      rust_target: x86_64-pc-windows-msvc
      resource_key: win32-x64
      cli_archive: true
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ needs.preflight.outputs.ref }}
      release_channel: nightly
      relay_client_tracing: false
      clerk_publishable_key: ${{ vars.KSG_CLERK_PUBLISHABLE_KEY }}
      clerk_jwt_template: ${{ vars.KSG_CLERK_JWT_TEMPLATE }}
      clerk_cli_oauth_client_id: ${{ vars.KSG_CLERK_CLI_OAUTH_CLIENT_ID }}
      relay_url: ${{ vars.KSG_RELAY_URL }}

  release:
    name: Publish GitHub release
    needs: [preflight, desktop_mac_arm64, desktop_linux_x64, desktop_win_x64]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: false
      - name: Install release notes test dependencies
        run: vp install --filter=@t3tools/desktop... --ignore-scripts
      - name: Test release version and notes
        run: node --test .github/scripts/ksg-release-version.test.cjs .github/scripts/ksg-release-notes.test.cjs
      - name: Fetch upstream nightly tags
        run: git fetch --no-tags https://github.com/pingdotgg/t3code.git 'refs/tags/v*:refs/tags/upstream/v*'
      - name: Generate KSG and upstream release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          UPSTREAM_TAG: ${{ needs.preflight.outputs.upstream_tag }}
        run: node .github/scripts/ksg-release-notes.cjs "$RUNNER_TEMP/ksg-release-notes.md"
      - uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets
      # Installers verify archives against this file.
      - name: Write CLI archive checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum t3-*.tar.gz t3-*.zip > SHA256SUMS
          cat SHA256SUMS
      # The Windows build suffixes its per-arch manifest (nightly-win-x64.yml)
      # so x64 and arm64 jobs cannot collide. electron-updater requests
      # nightly.yml, and only x64 is built here, so there is nothing to merge.
      - name: Verify nightly updater manifests
        working-directory: release-assets
        run: |
          set -euo pipefail
          mv nightly-win-x64.yml nightly.yml
          for manifest in nightly.yml nightly-mac.yml nightly-linux.yml; do
            test -s "$manifest"
            echo "$manifest"
          done
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(release-assets/*.dmg release-assets/*.zip release-assets/*.AppImage release-assets/*.deb release-assets/*.exe \
            release-assets/*.blockmap release-assets/*.tar.gz release-assets/SHA256SUMS)
          for manifest in release-assets/*.yml; do
            [[ "$manifest" == */builder-debug.yml ]] || files+=("$manifest")
          done
          gh release create "$TAG" "${files[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Fables $VERSION" \
            --notes-file "$RUNNER_TEMP/ksg-release-notes.md"
